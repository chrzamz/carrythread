name: Release builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag to build; leave blank to build the selected ref without a draft release'
        required: false
        type: string
      create_draft:
        description: 'Create a GitHub draft release after all builds pass (requires an existing version tag)'
        required: false
        default: false
        type: boolean

# Builds have no repository write permission. Only an explicitly requested draft gets it.
permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package / ${{ matrix.platform }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-2025
            platform: win
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      # Initial public builds are explicitly unsigned / not notarized.
      # Signing must be a separately configured and verified release change.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Validate version tag and native architecture
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const tag=process.env.RELEASE_TAG;
          if(tag) { assert.match(tag,/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/); assert.equal(tag,`v${p.version}`); }
          assert.equal(process.arch,process.env.TARGET_ARCH,'Use a native runner for the artifact architecture');
          console.log({version:p.version,tag:tag||'artifact-only',host:process.platform,arch:process.arch});
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Windows packaged startup preflight
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: |
          # Catch desktop-driver failures before downloading browsers or making installers.
          pnpm exec electron-builder --win --x64 --dir --publish never
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {resolve} from 'node:path';
          execFileSync(process.execPath,[resolve('node_modules/tsx/dist/cli.mjs'),'tests/e2e.ts'],{env:{...process.env,CARRYTHREAD_EXECUTABLE:resolve('release/win-unpacked/Carrythread.exe')},stdio:'inherit',timeout:180000});
          NODE
      - name: Electron source end-to-end on native macOS runners
        id: source_e2e
        if: runner.os == 'macOS'
        run: pnpm exec tsx tests/e2e.ts
      - name: Preserve source E2E screenshots
        if: runner.os == 'macOS'
        run: |
          node --input-type=module -e "import { cp } from 'node:fs/promises'; await cp('work/e2e-screenshots', 'work/e2e-source', { recursive: true });"
      - name: Install Linux virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth
      - name: Install icon renderer and Chromium/Electron GUI dependencies
        run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/generate-icons.mjs
      - name: Build unsigned macOS artifacts
        if: runner.os == 'macOS'
        run: pnpm exec electron-builder --mac --${TARGET_ARCH} --publish never '-c.artifactName=Carrythread-${version}-${os}-${arch}-unsigned.${ext}'
      - name: Build unsigned Windows artifacts
        if: runner.os == 'Windows'
        run: pnpm exec electron-builder --win --x64 --publish never '-c.nsis.artifactName=Carrythread-${version}-windows-${arch}-setup-unsigned.${ext}' '-c.portable.artifactName=Carrythread-${version}-windows-${arch}-portable-unsigned.${ext}'
      - name: Build Linux artifacts
        if: runner.os == 'Linux'
        run: pnpm exec electron-builder --linux --x64 --publish never '-c.artifactName=Carrythread-${version}-${os}-${arch}-unsigned.${ext}'
      - name: Locate the actual packaged application
        id: packaged_app
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {appendFile,readFile,readdir,rm,stat} from 'node:fs/promises';
          import {join,resolve,relative} from 'node:path';
          import {execFileSync} from 'node:child_process';
          const p=JSON.parse(await readFile('package.json','utf8'));
          const platform=process.env.TARGET_PLATFORM;
          const root=resolve('release');
          const directories=(await readdir(root,{withFileTypes:true})).filter(e=>e.isDirectory()).map(e=>join(root,e.name));
          const candidates=[];
          await rm('work/e2e-screenshots',{recursive:true,force:true});
          if(platform==='mac') {
            const appBundles=[];
            for(const directory of directories) {
              if(directory.endsWith('.app')) appBundles.push(directory);
              else for(const entry of await readdir(directory,{withFileTypes:true})) if(entry.isDirectory()&&entry.name.endsWith('.app')) appBundles.push(join(directory,entry.name));
            }
            for(const bundle of appBundles) {
              const executable=execFileSync('/usr/libexec/PlistBuddy',['-c','Print :CFBundleExecutable',join(bundle,'Contents','Info.plist')],{encoding:'utf8'}).trim();
              assert.ok(executable&&!/[\\/\r\n]/.test(executable),'Invalid CFBundleExecutable');
              const target=join(bundle,'Contents','MacOS',executable);
              if((await stat(target)).isFile()) candidates.push(target);
            }
          } else {
            const configured=p.build?.[platform==='win'?'win':'linux']?.executableName;
            const names=new Set([configured,p.build?.productName,p.productName,p.name].filter(Boolean).map(n=>n.toLowerCase()));
            for(const directory of directories.filter(d=>/unpacked$/i.test(d))) {
              for(const entry of await readdir(directory,{withFileTypes:true})) {
                if(!entry.isFile()) continue;
                const name=platform==='win'?entry.name.replace(/\.exe$/i,''):entry.name;
                if(!names.has(name.toLowerCase())||(platform==='win'&&!/\.exe$/i.test(entry.name))) continue;
                const target=join(directory,entry.name);
                if(platform!=='win') assert.ok((await stat(target)).mode&0o111,'Packaged Linux application is not executable');
                candidates.push(target);
              }
            }
          }
          assert.equal(candidates.length,1,`Expected one packaged application, found ${candidates.length}`);
          const executable=candidates[0];
          assert.ok(!/[\r\n]/.test(executable),'Invalid application path');
          await appendFile(process.env.GITHUB_ENV,`CARRYTHREAD_EXECUTABLE=${executable}\nCARRYTHREAD_PACKAGED_EXECUTABLE=${executable}\n`);
          console.log({packagedExecutable:relative(process.cwd(),executable),platform});
          NODE
      - name: Packaged application GUI end-to-end
        id: packaged_e2e
        timeout-minutes: 8
        # e2e.ts creates its own isolated CARRYTHREAD_DATA_DIR and localhost mock.
        # Only CI Linux adds --no-sandbox inside the synthetic test driver.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm exec tsx tests/e2e.ts
          else
            pnpm exec tsx tests/e2e.ts
          fi
      - name: Preserve unpacked packaged E2E screenshots
        run: |
          node --input-type=module -e "import { cp } from 'node:fs/promises'; await cp('work/e2e-screenshots', 'work/e2e-packaged', { recursive: true });"
      - name: Install the actual distribution into the temporary runner
        id: installer_setup
        timeout-minutes: 8
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {appendFile,mkdir,mkdtemp,readFile,readdir,realpath,rm,stat,writeFile} from 'node:fs/promises';
          import {basename,join,resolve} from 'node:path';
          import {execFileSync,spawnSync} from 'node:child_process';
          import {setTimeout as delay} from 'node:timers/promises';
          const p=JSON.parse(await readFile('package.json','utf8'));
          const platform=process.env.TARGET_PLATFORM;
          const temporary=await realpath(process.env.RUNNER_TEMP);
          const root=await mkdtemp(join(temporary,'carrythread-installer-'));
          const stateFile=join(root,'state.json');
          const state={platform,root,installAttempted:false,installStatus:'preparing',unpacked:await realpath(process.env.CARRYTHREAD_EXECUTABLE)};
          const save=()=>writeFile(stateFile,JSON.stringify(state,null,2));
          await save();
          await appendFile(process.env.GITHUB_ENV,`CARRYTHREAD_INSTALLER_STATE=${stateFile}\n`);
          await rm('work/e2e-screenshots',{recursive:true,force:true});
          const artifacts=(await readdir('release',{withFileTypes:true})).filter(e=>e.isFile()&&e.name.startsWith('Carrythread-')).map(e=>e.name);
          const installers=artifacts.filter(name=>platform==='mac'?name.endsWith('.dmg'):platform==='win'?/-setup-unsigned\.exe$/i.test(name):name.endsWith('.deb'));
          assert.equal(installers.length,1,'Expected one platform installer');
          const artifact=resolve('release',installers[0]);state.artifact=installers[0];
          const names=new Set([p.build?.[platform==='win'?'win':'linux']?.executableName,p.build?.productName,p.productName,p.name].filter(Boolean).map(n=>n.toLowerCase()));
          const isolatedEnv={...process.env,CARRYTHREAD_DATA_DIR:join(root,'bootstrap-profile')};
          let executable;
          if(platform==='mac') {
            state.method='dmg-readonly-copy';state.mount=join(root,'mounted');state.installed=join(root,'installed');
            await mkdir(state.mount);await mkdir(state.installed);state.installAttempted=true;await save();
            execFileSync('hdiutil',['attach','-readonly','-nobrowse','-mountpoint',state.mount,artifact],{stdio:'pipe',timeout:120000});
            state.mounted=true;await save();
            const apps=(await readdir(state.mount,{withFileTypes:true})).filter(e=>e.isDirectory()&&e.name.endsWith('.app'));
            assert.equal(apps.length,1,'Expected one application in the DMG');
            const app=join(state.installed,apps[0].name);
            execFileSync('ditto',[join(state.mount,apps[0].name),app],{stdio:'pipe',timeout:120000});
            const name=execFileSync('/usr/libexec/PlistBuddy',['-c','Print :CFBundleExecutable',join(app,'Contents','Info.plist')],{encoding:'utf8'}).trim();
            assert.ok(name&&!/[\\/\r\n]/.test(name),'Invalid installed CFBundleExecutable');
            executable=join(app,'Contents','MacOS',name);
          } else if(platform==='win') {
            state.method='nsis-silent';state.installed=join(root,'installed');state.installAttempted=true;await save();
            // NSIS /D must be last and unquoted. Quote argv0 separately for executable paths with spaces.
            assert.ok(!/["\r\n]/.test(state.installed),'Invalid NSIS installation directory');
            execFileSync(artifact,['/S',`/D=${state.installed}`],{env:isolatedEnv,argv0:`"${artifact}"`,windowsVerbatimArguments:true,windowsHide:true,stdio:'pipe',timeout:180000});
            let files=[];
            for(let attempt=0;attempt<30;attempt++) {
              files=await readdir(state.installed,{withFileTypes:true}).catch(()=>[]);
              const found=files.filter(e=>e.isFile()&&/\.exe$/i.test(e.name)&&names.has(e.name.replace(/\.exe$/i,'').toLowerCase()));
              if(found.length===1){executable=join(state.installed,found[0].name);break;}
              await delay(1000);
            }
            assert.ok(executable,'NSIS did not install the expected application');
            const uninstallers=files.filter(e=>e.isFile()&&/^uninstall.*\.exe$/i.test(e.name));
            assert.equal(uninstallers.length,1,'Expected one installed NSIS uninstaller');
            state.uninstaller=join(state.installed,uninstallers[0].name);await save();
          } else {
            state.method='deb-apt';
            state.packageName=execFileSync('dpkg-deb',['--field',artifact,'Package'],{encoding:'utf8'}).trim();
            assert.match(state.packageName,/^[a-z0-9][a-z0-9+.-]*$/);
            const prior=spawnSync('dpkg-query',['-W','-f=${db:Status-Status}',state.packageName],{encoding:'utf8'});
            assert.ok(prior.status!==0||prior.stdout.trim()!=='installed','Refuse to replace an already-installed package');
            state.installAttempted=true;await save();
            execFileSync('sudo',['apt-get','install','-y','--no-install-recommends',artifact],{env:{...isolatedEnv,DEBIAN_FRONTEND:'noninteractive'},stdio:'inherit',timeout:240000});
            const files=execFileSync('dpkg-query',['-L',state.packageName],{encoding:'utf8'}).split('\n');
            const found=[];
            for(const file of files) if(file.startsWith('/opt/')&&names.has(basename(file).toLowerCase())) {
              const info=await stat(file).catch(()=>null);if(info?.isFile()&&(info.mode&0o111)) found.push(file);
            }
            assert.equal(found.length,1,'Expected one package-owned /opt application executable');executable=found[0];
          }
          assert.ok((await stat(executable)).isFile(),'Installed executable is missing');
          assert.notEqual(await realpath(executable),state.unpacked,'Installer test must not reuse the unpacked application');
          state.executable=executable;state.installStatus='complete';await save();
          await appendFile(process.env.GITHUB_ENV,`CARRYTHREAD_EXECUTABLE=${executable}\n`);
          console.log({installer:state.artifact,method:state.method,installedExecutable:basename(executable),isolatedProfile:true});
          NODE
      - name: Installed application GUI end-to-end
        id: installer_e2e
        timeout-minutes: 8
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm exec tsx tests/e2e.ts
          else
            pnpm exec tsx tests/e2e.ts
          fi
      - name: Uninstall and clean temporary installer test
        id: installer_cleanup
        if: always() && steps.installer_setup.outcome != 'skipped'
        timeout-minutes: 6
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {mkdir,readFile,readdir,realpath,rm,stat,writeFile} from 'node:fs/promises';
          import {basename,join,relative,sep} from 'node:path';
          import {execFileSync,spawnSync} from 'node:child_process';
          const file=process.env.CARRYTHREAD_INSTALLER_STATE;
          if(!file){console.log('No installer state was created; no system installation was attempted.');process.exit(0);}
          const state=JSON.parse(await readFile(file,'utf8'));
          const temporary=await realpath(process.env.RUNNER_TEMP),root=await realpath(state.root),rel=relative(temporary,root);
          assert.ok(rel&&!rel.startsWith('..')&&!rel.includes(sep)&&basename(root).startsWith('carrythread-installer-'),'Refuse cleanup outside the owned temporary directory');
          if(state.platform==='mac'&&state.installAttempted&&state.mount) {
            const mounted=spawnSync('hdiutil',['detach',state.mount],{encoding:'utf8',timeout:60000});
            if(mounted.status!==0&&state.mounted) execFileSync('hdiutil',['detach','-force',state.mount],{stdio:'pipe',timeout:60000});
          } else if(state.platform==='win'&&state.installAttempted) {
            let uninstaller=state.uninstaller;
            if(!uninstaller) {
              const found=(await readdir(state.installed,{withFileTypes:true}).catch(()=>[])).filter(e=>e.isFile()&&/^uninstall.*\.exe$/i.test(e.name));
              if(found.length===1) uninstaller=join(state.installed,found[0].name);
            }
            assert.ok(uninstaller,'NSIS was attempted but no uninstaller is available; manual runner-state review required');
            const uninstallerReal=await realpath(uninstaller);
            assert.ok(uninstallerReal.startsWith(root+sep),'Uninstaller escaped the owned test installation');
            // _?= avoids the uninstaller self-copy so this call waits for completion.
            execFileSync(uninstallerReal,['/S',`_?=${state.installed}`],{env:{...process.env,CARRYTHREAD_DATA_DIR:join(root,'bootstrap-profile')},argv0:`"${uninstallerReal}"`,windowsVerbatimArguments:true,windowsHide:true,stdio:'pipe',timeout:180000});
            if(state.executable) assert.ok(!(await stat(state.executable).catch(()=>null)),'NSIS uninstall left the application executable installed');
          } else if(state.platform==='linux'&&state.installAttempted) {
            assert.match(state.packageName,/^[a-z0-9][a-z0-9+.-]*$/);
            execFileSync('sudo',['apt-get','remove','--purge','-y',state.packageName],{env:{...process.env,DEBIAN_FRONTEND:'noninteractive'},stdio:'inherit',timeout:180000});
            const remaining=spawnSync('dpkg-query',['-W','-f=${db:Status-Status}',state.packageName],{encoding:'utf8'});
            assert.ok(remaining.status!==0||remaining.stdout.trim()!=='installed','DEB uninstall did not remove the package');
          }
          await mkdir('work',{recursive:true});
          await writeFile('work/installer-validation.json',JSON.stringify({artifact:state.artifact,method:state.method,packageName:state.packageName||null,installStatus:state.installStatus,executableName:state.executable?basename(state.executable):null,distinctFromUnpacked:Boolean(state.executable&&state.installStatus==='complete'),cleanupStatus:'complete'},null,2)+'\n');
          await rm(root,{recursive:true,force:true});
          console.log({installer:state.artifact,method:state.method,cleanup:'complete'});
          NODE
      - name: Upload synthetic source, packaged, and installed E2E screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-e2e-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            work/e2e-source/
            work/e2e-packaged/
            work/e2e-screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stage installers, checksums, and truthful build record
        env:
          SOURCE_E2E_OUTCOME: ${{ steps.source_e2e.outcome }}
          PACKAGED_E2E_OUTCOME: ${{ steps.packaged_e2e.outcome }}
          INSTALLER_SETUP_OUTCOME: ${{ steps.installer_setup.outcome }}
          INSTALLER_E2E_OUTCOME: ${{ steps.installer_e2e.outcome }}
          INSTALLER_CLEANUP_OUTCOME: ${{ steps.installer_cleanup.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {copyFile,mkdir,readFile,readdir,writeFile} from 'node:fs/promises';
          import {join,relative} from 'node:path';
          import {execFileSync} from 'node:child_process';
          const p=JSON.parse(await readFile('package.json','utf8'));
          const platform=process.env.TARGET_PLATFORM,arch=process.env.TARGET_ARCH;
          assert.equal(process.env.PACKAGED_E2E_OUTCOME,'success','Packaged E2E must pass before publishing artifacts');
          for(const key of ['INSTALLER_SETUP_OUTCOME','INSTALLER_E2E_OUTCOME','INSTALLER_CLEANUP_OUTCOME']) assert.equal(process.env[key],'success',`${key} must pass`);
          const installer=JSON.parse(await readFile('work/installer-validation.json','utf8'));
          assert.equal(installer.installStatus,'complete');assert.equal(installer.cleanupStatus,'complete');assert.equal(installer.distinctFromUnpacked,true);
          if(platform==='mac') assert.equal(process.env.SOURCE_E2E_OUTCOME,'success','macOS source E2E must pass');
          const files=(await readdir('release',{withFileTypes:true})).filter(e=>e.isFile()&&/^Carrythread-/.test(e.name)&&/\.(?:dmg|zip|exe|AppImage|deb)$/.test(e.name)).map(e=>e.name).sort();
          assert.ok(files.length>=2,'Expected both configured distribution targets');
          // electron-builder uses each Linux format's native architecture label.
          const artifactArch=name=>platform==='linux'&&arch==='x64'?(name.endsWith('.deb')?'amd64':name.endsWith('.AppImage')?'x86_64':arch):arch;
          assert.ok(files.every(name=>name.includes(`-${artifactArch(name)}-`)&&name.includes('-unsigned.')),'Artifact names must identify architecture and signing state');
          await mkdir('release-artifacts',{recursive:true});
          const sums=[];
          for(const file of files) {const bytes=await readFile(join('release',file));sums.push(`${createHash('sha256').update(bytes).digest('hex')}  ${file}`);await copyFile(join('release',file),join('release-artifacts',file));}
          await writeFile(`release-artifacts/SHA256SUMS-${platform}-${arch}.txt`,sums.join('\n')+'\n');
          const record={version:p.version,tag:process.env.RELEASE_TAG||null,commit:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),target:{platform,arch},runner:{platform:process.platform,arch:process.arch,node:process.version},artifacts:files,codeSigning:'No developer-identity signing configured; unsigned distribution',notarization:'Not performed',runtimeSignatureNote:'Platform runtimes may contain ad-hoc signatures; these are not developer signing or notarization.',coreChecks:'pnpm check passed',sourceE2E:{status:process.env.SOURCE_E2E_OUTCOME==='success'?'passed':'not-run',note:process.platform==='darwin'?'Real Electron built-source run, synthetic localhost provider':'Source E2E is not run in this packaging job'},packagedE2E:{status:'passed',executable:relative(process.cwd(),process.env.CARRYTHREAD_PACKAGED_EXECUTABLE),profile:'Isolated synthetic application data',provider:'Synthetic localhost HTTP mock',nativeAgentStarted:false,linuxSandboxDisabledForSyntheticTest:process.platform==='linux'},installerInstallation:{status:'passed',artifact:installer.artifact,method:installer.method,guiE2E:'passed',cleanup:'passed',distinctFromUnpacked:true,packageName:installer.packageName,profile:'Isolated synthetic application data',linuxSandboxDisabledForSyntheticTest:process.platform==='linux',limits:'CI runner installation only. Does not verify end-user Gatekeeper/SmartScreen/quarantine prompts, AppImage runtime, Windows portable wrapper, or real native-agent execution.'}};
          await writeFile(`release-artifacts/BUILD-${platform}-${arch}.json`,JSON.stringify(record,null,2)+'\n');
          console.log({artifacts:files,signing:record.codeSigning});
          NODE
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  draft:
    name: Optional draft release
    if: github.event_name == 'workflow_dispatch' && inputs.create_draft && inputs.tag != '' && github.repository == 'chrzamz/carrythread'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: chrzamz/carrythread
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: distribution-*
          merge-multiple: true
          path: distribution
      - name: Verify downloaded artifacts and prepare draft notes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFile,readdir,writeFile} from 'node:fs/promises';
          import {join} from 'node:path';
          assert.match(process.env.RELEASE_TAG,/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          const files=await readdir('distribution');
          const manifests=files.filter(n=>n.startsWith('SHA256SUMS-'));
          assert.equal(manifests.length,4,'All four target manifests are required');
          const records=await Promise.all(files.filter(n=>/^BUILD-.*\.json$/.test(n)).map(async n=>JSON.parse(await readFile(join('distribution',n),'utf8'))));
          assert.equal(records.length,4,'All four build records are required');
          assert.ok(records.every(r=>r.packagedE2E?.status==='passed'),'Packaged GUI E2E evidence is required for every target');
          assert.ok(records.every(r=>r.installerInstallation?.status==='passed'&&r.installerInstallation?.guiE2E==='passed'&&r.installerInstallation?.cleanup==='passed'),'Actual installer, installed GUI, and cleanup evidence are required for every target');
          assert.equal(new Set(records.map(r=>r.commit)).size,1,'Targets were built from different commits');
          assert.ok(records.every(r=>`v${r.version}`===process.env.RELEASE_TAG&&r.tag===process.env.RELEASE_TAG),'Build records do not match the requested tag');
          const all=[];
          for(const file of manifests) for(const line of (await readFile(join('distribution',file),'utf8')).trim().split('\n')) {
            const match=/^([a-f0-9]{64})  (Carrythread-[A-Za-z0-9._-]+)$/.exec(line);assert.ok(match,'Invalid checksum line');
            assert.equal(createHash('sha256').update(await readFile(join('distribution',match[2]))).digest('hex'),match[1],match[2]);all.push(line);
          }
          assert.equal(new Set(all.map(l=>l.slice(66))).size,all.length,'Duplicate artifact filenames');
          await writeFile('distribution/SHA256SUMS.txt',all.sort().join('\n')+'\n');
          await writeFile('release-notes.md',`# Carrythread ${process.env.RELEASE_TAG}\n\nDraft build artifacts for release review.\n\n- All supplied binaries are unsigned distributions without configured developer-identity signing. macOS builds are not notarized. Embedded runtime ad-hoc signatures are not developer signing.\n- SHA256SUMS.txt verifies the downloadable installer bytes. BUILD-*.json records the exact build commit and target.\n- Unit/build checks and unpacked packaged-application GUI E2E passed on all four native targets with isolated synthetic data and a localhost provider. macOS source E2E also passed. Linux synthetic CI E2E uses Xvfb with a test-only --no-sandbox flag; this does not validate sandboxed production startup. Actual DMG mount/copy, NSIS silent installation, and DEB apt installation are followed by installed-app GUI E2E and cleanup on their native CI runners. End-user Gatekeeper/SmartScreen/quarantine prompts, AppImage runtime, the Windows portable wrapper, live external providers, and actual native-agent receipt remain separate checks.\n- Review docs/RELEASE-CHECKLIST.md before publishing this draft.\n`);
          NODE
      - name: Create draft only; never overwrite an existing release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A release already exists. Review and update it manually; no files were replaced.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Carrythread $RELEASE_TAG" --notes-file release-notes.md distribution/*
